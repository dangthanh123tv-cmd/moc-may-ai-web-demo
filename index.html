<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315d3a"><title>Mộc Mây AI Web</title><style>:root{--g:#315d3a;--bg:#f7f3e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:#243027}.wrap{max-width:760px;margin:auto;padding:20px 16px}.brand{font-size:34px;font-weight:800;color:var(--g)}.sub{color:#5d665f;margin:4px 0 16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0001}.status{min-height:24px;color:#68716a}.chat{height:50vh;overflow:auto}.msg{padding:12px 14px;border-radius:14px;margin:9px 0;white-space:pre-wrap;line-height:1.5}.u{background:#e5efe7;margin-left:15%}.a{background:#f1efe9;margin-right:10%}.row{display:flex;gap:8px;margin-top:10px}textarea{flex:1;border:1px solid #d8ddd8;border-radius:14px;padding:12px;font:inherit;resize:none}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--g);color:#fff}button:disabled{opacity:.5}.note{font-size:12px;color:#68716a;line-height:1.4}</style></head><body><main class="wrap"><div class="brand">MỘC MÂY AI</div><div class="sub">V28.2 Web • Qwen2.5-0.5B-Instruct • WebGPU</div><section class="card"><div id="status">Kiểm tra WebGPU…</div><div class="row"><button id="load">NẠP QWEN WEB</button><button id="clear" type="button">XÓA CHAT</button></div><div class="note">Lần đầu trình duyệt sẽ tải model WebLLM. AI chạy ngay trên thiết bị, không cần API key.</div></section><section class="card chat" id="chat"></section><section class="card"><textarea id="input" rows="2" placeholder="Nhập câu hỏi…"></textarea><div class="row"><button id="send" disabled>GỬI</button></div></section></main><script type="module">
const $=s=>document.querySelector(s), status=$('#status'),chat=$('#chat'),load=$('#load'),sendBtn=$('#send'),input=$('#input');let engine=null;
const id='qwen2.5-0.5b-instruct-q4f16',appConfig={model_list:[{model:'https://huggingface.co/skillsafe-ai/qwen2.5-0.5b-instruct-q4f16',model_id:id,model_lib:'https://huggingface.co/skillsafe-ai/qwen2.5-0.5b-instruct-q4f16/resolve/main/lib/Qwen2-0.5B-Instruct-q4f16_1-ctx4k_cs1k-webgpu.wasm',overrides:{context_window_size:4096,prefill_chunk_size:1024}}]};
function add(c,t){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight;return d}
status.innerHTML=navigator.gpu?'WebGPU: <b>SẴN SÀNG</b>':'WebGPU: <b>KHÔNG KHẢ DỤNG</b> — dùng Chrome/Edge hỗ trợ WebGPU';
load.onclick=async()=>{load.disabled=true;try{const w=await import('https://esm.run/@mlc-ai/web-llm@0.2.84');engine=await w.CreateMLCEngine(id,{appConfig,initProgressCallback:p=>status.textContent=p.text||'Đang nạp Qwen…'});status.innerHTML='Qwen: <b>READY</b> • WebGPU • 0.5B';sendBtn.disabled=false;add('a','Mộc Mây AI Web đã sẵn sàng.');}catch(e){status.textContent='Lỗi nạp Qwen: '+(e?.message||e);load.disabled=false}};
async function send(){const t=input.value.trim();if(!t||!engine)return;input.value='';add('u',t);const out=add('a','Đang suy nghĩ…');sendBtn.disabled=true;try{const r=await engine.chat.completions.create({messages:[{role:'system',content:'Bạn là Mộc Mây AI, trả lời ngắn gọn bằng tiếng Việt.'},{role:'user',content:t}],temperature:.7,top_p:.8,max_tokens:256});out.textContent=r.choices?.[0]?.message?.content||'Không có phản hồi.'}catch(e){out.textContent='Lỗi inference: '+(e?.message||e)}sendBtn.disabled=false}
sendBtn.onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#clear').onclick=()=>chat.innerHTML='';
</script></body></html>
